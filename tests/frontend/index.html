<!--
  Frontend tests. Serve the repository root, not public/, so this page reaches the panel:
    python3 -m http.server 8080
  then open http://localhost:8080/tests/frontend/
  ?only=toggle runs only the tests whose name contains "toggle".
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../public/assets/logo/favicon.svg" type="image/svg+xml" />
    <title>PiSton tests</title>
    <link rel="stylesheet" href="../../public/main.css" />
    <style>
      body { padding: 24px; }
      main { display: grid; gap: 16px; max-width: 1000px; }
      .summary { font-weight: 600; }
      .summary[data-result="pass"] { color: var(--grass); }
      .summary[data-result="fail"] { color: var(--redstone); }
      .results { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
      .results li { font-size: 14px; }
      .result__mark { font-family: var(--font-mono); }
      .results [data-result="pass"] .result__mark { color: var(--grass); }
      .results [data-result="fail"] .result__mark { color: var(--redstone); }
      .results pre { margin: 4px 0 8px 24px; white-space: pre-wrap; font-size: 13px; color: var(--deepslate-300); }
      .fixture { padding: 16px; border: 1px dashed var(--deepslate-500); }
      .fixture:empty { display: none; }
      .frame-box { overflow: auto; border: 1px solid var(--deepslate-500); }
      .frame-box iframe { display: block; height: 800px; border: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>PiSton – frontend tests</h1>
      <p class="summary" id="summary" role="status">Loading …</p>
      <ol class="results" id="results"></ol>
      <!-- Components under test live here while their test runs -->
      <div class="fixture" id="fixture"></div>
      <!-- The panel pages under test (pages.test.js) -->
      <div class="frame-box">
        <iframe id="page-frame" title="Panel page under test" src="about:blank"></iframe>
      </div>
    </main>

    <script type="module">
      import { run } from './runner.js';
      import './components.test.js';
      import './logic.test.js';
      import './pages.test.js';

      await run({
        list: document.getElementById('results'),
        summary: document.getElementById('summary'),
        fixture: document.getElementById('fixture'),
        only: new URLSearchParams(location.search).get('only') ?? undefined,
      });
    </script>
  </body>
</html>
