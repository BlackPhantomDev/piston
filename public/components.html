<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
    <title>PiSton – Komponenten</title>
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <script type="module" src="js/main.js"></script>
    <style>
        /* Layout of this overview page only */
        .demo { max-width: 1280px; margin: 0 auto; padding: var(--space-6) var(--space-4); display: grid; gap: var(--space-6); }
        .demo section { display: grid; gap: var(--space-3); }
        .demo-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-4); align-items: start; }
    </style>
</head>
<body>
<main class="demo">
    <h1>Komponenten</h1>

    <section>
        <h2>Buttons</h2>
        <div class="card demo-row">
            <button class="btn btn--primary">Server starten</button>
            <button class="btn btn--secondary">Neu starten</button>
            <button class="btn btn--ghost">Abbrechen</button>
            <button class="btn btn--danger">Server stoppen</button>
        </div>
        <div class="card demo-row">
            <button class="btn btn--primary" disabled>Server starten</button>
            <button class="btn btn--secondary" disabled>Neu starten</button>
            <button class="btn btn--ghost" disabled>Abbrechen</button>
            <button class="btn btn--danger" disabled>Server stoppen</button>
        </div>
        <div class="card demo-row">
            <button class="btn btn--primary btn--s">Klein</button>
            <button class="btn btn--primary">Mittel</button>
            <button class="btn btn--primary btn--l">Groß</button>
            <button class="btn btn--primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>
                Starten
            </button>
            <button class="btn btn--secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
                Neu starten
            </button>
            <button class="btn btn--secondary btn--icon" aria-label="Einstellungen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            </button>
            <button class="btn btn--secondary btn--icon" aria-label="Löschen">
                <svg class="icon--danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 7 20 7"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
            </button>
        </div>
    </section>

    <section>
        <h2>Eingabefelder</h2>
        <div class="card demo-grid">
            <mc-field label="Standard" help="Hilfetext zum Feld">
                <input class="input" placeholder="z. B. Mein Server">
            </mc-field>
            <mc-field label="Fehler" help="1–65535" error="Port muss zwischen 1 und 65535 liegen">
                <input class="input input--mono" value="99999">
            </mc-field>
            <mc-field label="Deaktiviert" help="Nur bei gestopptem Server änderbar">
                <input class="input input--mono" value="25565" disabled>
            </mc-field>
            <mc-field label="Auswahl (Select)">
                <div class="select">
                    <select class="input">
                        <option>Friedlich</option>
                        <option>Leicht</option>
                        <option selected>Normal</option>
                        <option>Schwer</option>
                    </select>
                </div>
            </mc-field>
            <mc-field label="Zahl mit Stepper">
                <mc-stepper><input type="number" min="1" max="100" value="20"></mc-stepper>
            </mc-field>
            <mc-field>
                <label>Regler · Sichtweite <output for="view-distance">10</output></label>
                <mc-range><input type="range" id="view-distance" min="2" max="32" value="10"></mc-range>
            </mc-field>
            <mc-field label="Mit Einheit">
                <div class="input-group">
                    <input type="number" value="4096">
                    <span class="input-group__addon">MB</span>
                </div>
            </mc-field>
        </div>
    </section>

    <section>
        <h2>Schalter &amp; Checkbox</h2>
        <div class="card demo-grid">
            <div>
                <mc-toggle checked>PvP erlaubt</mc-toggle>
                <mc-toggle>Whitelist aktiv</mc-toggle>
                <mc-toggle disabled>Deaktiviert</mc-toggle>
            </div>
            <div>
                <label class="checkbox"><input type="checkbox" checked> Command-Blöcke</label><br>
                <label class="checkbox"><input type="checkbox"> Nether aktiv</label><br>
                <label class="checkbox"><input type="checkbox" disabled> Deaktiviert</label>
            </div>
        </div>
        <div class="card setting-list">
            <mc-toggle layout="row" checked description="Spieler können Netherportale benutzen.">Nether aktiv</mc-toggle>
            <mc-toggle layout="row" description="Nur freigegebene Spieler dürfen beitreten.">Whitelist</mc-toggle>
        </div>
    </section>

    <section>
        <h2>Status &amp; Konsole</h2>
        <div class="card demo-row">
            <status-badge status="online"></status-badge>
            <status-badge status="offline"></status-badge>
            <status-badge status="starting"></status-badge>
            <status-badge status="stopping"></status-badge>
        </div>
        <form class="console-input" onsubmit="return false">
            <span class="console-input__prompt" aria-hidden="true">&gt;</span>
            <input aria-label="Befehl" placeholder="Befehl eingeben, z. B. say Hallo" autocomplete="off">
            <button class="btn btn--primary btn--s">Senden</button>
        </form>
    </section>
</main>

</html>
