<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="assets/logo/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <title>PiSton</title>
    <link rel="stylesheet" href="main.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- First tab stop: skips the sidebar. Hidden until focused; main.js handles it (the hash holds the route). -->
    <a class="skip-link" href="#main" data-i18n="nav.skip"></a>

    <div class="app">
      <!-- Narrow screens only -->
      <header class="topbar">
        <button
          class="btn btn--ghost btn--icon"
          type="button"
          id="nav-toggle"
          aria-controls="sidebar"
          aria-expanded="false"
          data-i18n-label="nav.menu"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="18" x2="20" y2="18" />
          </svg>
        </button>
        <div class="topbar__brand">
          <img
            src="assets/logo/piston-logo.svg"
            alt=""
            width="32"
            height="32"
          />
          <span class="wordmark"><span class="wordmark__pi">Pi</span>Ston</span>
        </div>
        <!-- Narrow screens: the language switch sits here instead of the sidebar footer -->
        <piston-lang-switch class="topbar__lang"></piston-lang-switch>
      </header>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <img
            src="assets/logo/piston-logo.svg"
            alt=""
            width="40"
            height="40"
          />
          <div>
            <p class="wordmark"><span class="wordmark__pi">Pi</span>Ston</p>
            <p class="sidebar__server" id="server-name">–</p>
          </div>
        </div>
        <div class="card card--outline card--compact address-box">
          <p class="card__label">
            <span data-i18n="sidebar.address"></span
            ><span
              class="card__label-note"
              id="address-stale"
              hidden
              data-i18n="sidebar.addressStale"
            ></span>
          </p>
          <button
            class="address-box__copy"
            type="button"
            id="copy-address"
            data-i18n-label="sidebar.copyAddress"
            disabled
          >
            <svg
              class="address-box__icon-copy"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="9" width="11" height="11" rx="2" />
              <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
            </svg>
            <svg
              class="address-box__icon-done"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
            <!-- Visible hint only; screen readers get the label and the status below -->
            <span
              class="tooltip"
              aria-hidden="true"
              id="copy-address-tip"
              data-i18n="sidebar.copyAddress"
            ></span>
          </button>
          <p class="card__value" id="server-address">–</p>
          <p class="visually-hidden" role="status" id="copy-address-status"></p>
        </div>

        <nav class="nav" data-i18n-label="nav.label">
          <ul>
            <li>
              <a class="nav__link" href="#/home" data-route="home">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M3 11l9-7 9 7" />
                  <path d="M5 10v10h14V10" />
                </svg>
                <span data-i18n="nav.home"></span>
              </a>
            </li>
            <li>
              <a class="nav__link" href="#/console" data-route="console">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="3" y="4" width="18" height="16" rx="2" />
                  <polyline points="7 9 10 12 7 15" />
                  <line x1="13" y1="15" x2="17" y2="15" />
                </svg>
                <span data-i18n="nav.console"></span>
              </a>
            </li>
            <li>
              <a class="nav__link" href="#/settings" data-route="settings">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M4 6h3M11 6h9M4 12h9M17 12h3M4 18h1M9 18h11" />
                  <circle cx="9" cy="6" r="2" />
                  <circle cx="15" cy="12" r="2" />
                  <circle cx="7" cy="18" r="2" />
                </svg>
                <span data-i18n="nav.settings"></span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar__bottom">
          <piston-lang-switch></piston-lang-switch>

          <!-- Required attribution, see ADDITIONAL_TERMS (term 1). Do not remove.
                 Wide screens show it here; narrow screens use the footer below the content. -->
          <footer class="legal-notice legal-notice--sidebar">
            <span class="legal-notice__line"
              >Powered by
              <a href="https://pistonpanel.dev"
                >PiSton</a
              ></span
            >
            <span
              class="legal-notice__line legal-notice__version"
              data-version
            ></span>
            <span class="legal-notice__line"
              ><a href="https://github.com/BlackPhantomDev/piston" data-i18n="legal.source">Quellcode</a>
              (AGPLv3)</span
            >
          </footer>
        </div>
      </aside>
      <div class="sidebar-backdrop"></div>

      <div class="content">
        <main class="page" id="main"></main>

        <!-- Notices of failed actions (js/errors.js), bottom right -->
        <div class="notices" id="notices"></div>

        <!-- Required attribution, see ADDITIONAL_TERMS (term 1). Do not remove.
             Narrow screens only – the sidebar is collapsed there; wide screens show it in the sidebar. -->
        <footer class="legal-notice legal-notice--content">
          Powered by
          <a href="https://pistonpanel.dev">PiSton</a>
          <span class="legal-notice__version" data-version></span> ·
          <a href="https://github.com/BlackPhantomDev/piston" data-i18n="legal.source">Quellcode</a>
          (AGPLv3)
        </footer>
      </div>
    </div>
  </body>
</html>
